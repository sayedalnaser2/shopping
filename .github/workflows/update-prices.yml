name: Update prices
on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scraper/scrape.py --stores jazira,megamart
      - run: |
          git config user.name "price-bot"; git config user.email "bot@users.noreply.github.com"
          git add prices.js
          git diff --cached --quiet || (git commit -m "Update prices" && git push)
